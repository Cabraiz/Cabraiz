<stop offset="0" stop-color="#0969da" stop-opacity=".12"/>
<stop offset="1" stop-color="#0969da" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.2" fill="#d0d7de"/>
</pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
<stop offset=".5" stop-color="#fff" stop-opacity="0"/>
<stop offset=".8" stop-color="#fff" stop-opacity="1"/>
</linearGradient>
<mask id="dots-mask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
<clipPath id="frame"><rect width="1280" height="320" rx="16"/></clipPath>
