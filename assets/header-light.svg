<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Mateus Cabral, Senior AI Engineer and full-stack developer, based in Fortaleza, Brazil">
<style>
.phrase { opacity: 0; animation: phrase 12s linear infinite; }
@keyframes phrase { 0% { opacity: 0; } 3%, 30% { opacity: 1; } 33.3%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .pulse { display: none; }
